<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Worldbreach</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1 15 15H1z%22 fill=%22%23eef1f5%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- the touch controls' icons, drawn once and used by the buttons and the touch help -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-fire" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="13"/><path d="M24 3v10M24 35v10M3 24h10M35 24h10"/></g><circle cx="24" cy="24" r="3" fill="currentColor"/></symbol>
    <symbol id="i-aim" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="7"/></g><path d="M24 8v8M24 32v8M8 24h8M32 24h8" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-jump" viewBox="0 0 48 48"><path d="M10 30 24 16l14 14M10 40h28" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-reload" viewBox="0 0 48 48"><path d="M37 17a15 15 0 1 0 2 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M39 6v12H27" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-action" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="6"/><path d="M24 8a16 16 0 0 1 16 16M8 24A16 16 0 0 1 24 8M40 24a16 16 0 0 1-16 16M24 40A16 16 0 0 1 8 24" stroke-dasharray="6 6"/></g></symbol>
    <symbol id="i-torch" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M6 20h12l6-5v18l-6-5H6z"/><path d="M30 14l10-5M31 24h12M30 34l10 5"/></g></symbol>
    <symbol id="i-pause" viewBox="0 0 48 48"><path d="M15 10h6v28h-6zM27 10h6v28h-6z" fill="currentColor"/></symbol>
    <symbol id="i-stick" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="8" fill="currentColor"/></symbol>
    <symbol id="i-drag" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24h36M12 18l-6 6 6 6M36 18l6 6-6 6M24 6v36M18 12l6-6 6 6M18 36l6 6 6-6"/></g></symbol>
    <symbol id="i-slots" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3"><rect x="4" y="16" width="12" height="16"/><rect x="18" y="16" width="12" height="16"/><rect x="32" y="16" width="12" height="16"/></g></symbol>
  </svg>

  <!-- phones and tablets (src/touch.js): the left of the screen moves, the rest turns the view -->
  <div id="touch" class="hidden">
    <div id="stick"><div id="stick-knob"></div></div>
    <div class="tbtn" id="t-pause" data-act="pause" data-t-title="help.pause"><svg><use href="#i-pause"/></svg></div>
    <div class="tbtn" id="t-torch" data-act="torch" data-t-title="help.torch"><svg><use href="#i-torch"/></svg></div>
    <div class="tbtn hidden" id="t-action" data-act="action" data-t-title="touch.action"><svg><use href="#i-action"/></svg></div>
    <div class="tbtn" id="t-reload" data-act="reload" data-t-title="help.reload"><svg><use href="#i-reload"/></svg></div>
    <div class="tbtn" id="t-grenade" data-act="grenade"><i class="gren"></i></div>
    <div class="tbtn" id="t-jump" data-act="jump" data-t-title="help.jump"><svg><use href="#i-jump"/></svg></div>
    <div class="tbtn" id="t-aim" data-act="aim" data-t-title="touch.aim"><svg><use href="#i-aim"/></svg></div>
    <div class="tbtn" id="t-fire" data-act="fire" data-t-title="help.fire"><svg><use href="#i-fire"/></svg></div>
  </div>
  <div id="rotate"><svg viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="16" width="32" height="18" rx="3"/><path d="M14 9a14 14 0 0 1 20 0M31 6l3 3-4 2"/></g></svg><p data-t="touch.rotate"></p></div>

  <div id="hud" class="hidden">
    <div id="minimap-wrap">
      <canvas id="minimap" width="200" height="200"></canvas>
    </div>

    <div id="top-center">
      <div id="wave-label"><span id="wave-word" data-t="hud.wave"></span> <span id="wave-num">1</span><span class="dim" id="wave-total">/5</span></div>
      <div id="timer">00:00</div>
      <div id="objective"></div>
    </div>

    <div id="top-right">
      <div class="label" id="left-label" data-t="hud.left"></div>
      <div id="enemies-left">0</div>
      <div class="label" id="score-label" data-t="hud.score"></div>
      <div id="score">0</div>
    </div>
    <div id="killfeed"></div>
    <div id="scoreboard" class="hidden"></div>

    <div id="crosshair">
      <i class="ch t"></i><i class="ch b"></i><i class="ch l"></i><i class="ch r"></i>
    </div>
    <div id="hitmarker"></div>
    <div id="points"><div id="points-total"></div><div id="points-list"></div></div>
    <div id="damage-dirs"></div>

    <div id="bottom-left">
      <div class="label" data-t="hud.health"></div>
      <div id="health-bar"><div id="health-fill"></div><div id="health-ghost"></div></div>
      <div id="health-num">100</div>
    </div>

    <div id="bottom-right">
      <div id="weapon-name"></div>
      <div id="ammo"><span id="ammo-mag">12</span><span class="dim" id="ammo-sep"> / </span><span id="ammo-res">∞</span></div>
      <div id="reload-hint" class="hidden" data-t="hud.reload"></div>
      <div id="grenades"></div>
      <div id="slots">
        <!-- the universe's weapons, named by src/main.js -->
        <div class="slot" data-slot="0"></div>
        <div class="slot" data-slot="1"></div>
        <div class="slot" data-slot="2"></div>
        <div class="slot" data-slot="3"></div>
        <div class="slot" data-slot="4"></div>
      </div>
    </div>

    <div id="team"></div>
    <div id="prompt" class="hidden"></div>
    <div id="downed" class="hidden"><div class="downed-title" id="downed-title"></div><div id="downed-sub"></div><div class="revive-bar"><div id="downed-fill"></div></div></div>

    <!-- medal and wave banner can show at once: stacked in one column so they never overlap -->
    <div id="announce">
      <div id="medal" class="hidden"></div>
      <div id="banner" class="hidden"><div id="banner-title"></div><div id="banner-sub"></div></div>
    </div>
    <div id="pickup-msg"></div>

    <div id="cards" class="hidden">
      <div id="cards-title" data-t="hud.cards"></div>
      <div id="cards-sub"></div>
      <div id="cards-list"></div>
    </div>
  </div>

  <div id="parry-flash"></div>
  <div id="vignette"></div>
  <div id="ads-vignette"></div>
  <div id="charm"></div>
  <div id="ink"></div>
  <div id="hugger"></div>
  <div id="scope" class="hidden"><div class="reticle"></div></div>

  <div id="menu" class="screen">
    <div class="panel">
      <h1 id="menu-title" data-t-html="menu.title"></h1>
      <p class="lede" data-t-html="menu.lede"></p>
      <div id="world"></div>
      <p class="lede small" id="menu-lede"></p>
      <div id="mode" class="seg-row">
        <button data-mode="waves" data-t="mode.waves"></button>
        <button data-mode="survival" data-t="mode.survival"></button>
        <button data-mode="sandbox" data-t="mode.sandbox" data-t-title="mode.sandboxHelp"></button>
      </div>
      <div id="difficulty">
        <button data-diff="easy" data-t="diff.easy"></button>
        <button data-diff="normal" data-t="diff.normal"></button>
        <button data-diff="hard" data-t="diff.hard"></button>
      </div>
      <button id="btn-play" disabled>…</button>
      <button class="secondary mp-only" id="btn-coop" data-t="btn.multiplayer"></button>
      <button class="secondary btn-options" data-t="btn.options"></button>
      <button class="secondary" id="btn-board" data-t="btn.board"></button>
      <div class="help" id="help-main"></div>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="panel">
      <h2 data-t="pause.title"></h2>
      <button id="btn-resume" data-t="btn.resume"></button>
      <button class="secondary btn-options" data-t="btn.options"></button>
      <button id="btn-restart" class="secondary" data-t="btn.restart"></button>
      <div class="help" id="help-pause"></div>
    </div>
  </div>

  <div id="options" class="screen hidden">
    <div class="panel">
      <h2 data-t="btn.options"></h2>
      <div class="opts">
        <label for="o-name" data-t="opt.name"></label>
        <div class="opt-row"><input type="text" id="o-name" maxlength="16" spellcheck="false" /></div>
        <label for="o-sens" data-t="opt.sens"></label>
        <div class="opt-row"><input type="range" id="o-sens" min="0.2" max="3" step="0.05" /><output id="v-sens"></output></div>
        <label for="o-invert" data-t="opt.invert"></label>
        <div class="opt-row"><input type="checkbox" id="o-invert" /></div>
        <label for="o-fov" data-t="opt.fov"></label>
        <div class="opt-row"><input type="range" id="o-fov" min="60" max="100" step="1" /><output id="v-fov"></output></div>
        <label for="o-master" data-t="opt.master"></label>
        <div class="opt-row"><input type="range" id="o-master" min="0" max="1" step="0.05" /><output id="v-master"></output></div>
        <label for="o-sfx" data-t="opt.sfx"></label>
        <div class="opt-row"><input type="range" id="o-sfx" min="0" max="1" step="0.05" /><output id="v-sfx"></output></div>
        <label for="o-music" data-t="opt.music"></label>
        <div class="opt-row"><input type="range" id="o-music" min="0" max="1" step="0.05" /><output id="v-music"></output></div>
        <label data-t="opt.quality"></label>
        <div class="opt-row seg" id="o-quality">
          <button data-q="low" data-t="opt.low"></button><button data-q="medium" data-t="opt.medium"></button><button data-q="high" data-t="opt.high"></button>
        </div>
        <label for="o-shake" data-t="opt.shake"></label>
        <div class="opt-row"><input type="checkbox" id="o-shake" /></div>
        <label for="o-fps" data-t="opt.fps"></label>
        <div class="opt-row"><input type="checkbox" id="o-fps" /></div>
        <label for="o-hpnum" data-t="opt.hpnum"></label>
        <div class="opt-row"><input type="checkbox" id="o-hpnum" /></div>
        <label data-t="opt.lang"></label>
        <!-- each language in its own words -->
        <div class="opt-row seg" id="o-lang">
          <button data-lang="en">English</button><button data-lang="fr">Français</button>
        </div>
      </div>
      <button id="btn-options-back" data-t="btn.back"></button>
      <button id="btn-options-reset" class="secondary" data-t="opt.reset"></button>
    </div>
  </div>

  <div id="fps" class="hidden"></div>

  <div id="end" class="screen hidden">
    <div class="panel">
      <h2 id="end-title"></h2>
      <p id="end-sub" class="lede"></p>
      <div id="end-score"></div>
      <div id="stats"></div>
      <div id="end-board"></div>
      <button id="btn-again" data-t="btn.again"></button>
      <button class="secondary" id="btn-menu" data-t="btn.menu"></button>
    </div>
  </div>

  <div id="coop" class="screen hidden">
    <div class="panel">
      <h2 data-t="coop.title"></h2>
      <p class="lede" data-t-html="coop.lede"></p>
      <h3 class="rooms-title" data-t="coop.rooms"></h3>
      <ul id="coop-rooms"><li class="empty" data-t="coop.noRooms"></li></ul>
      <div class="opts">
        <label for="c-server" data-t="coop.server"></label>
        <div class="opt-row"><input type="text" id="c-server" spellcheck="false" /></div>
        <label for="c-code" data-t="coop.byCode"></label>
        <div class="opt-row"><input type="text" id="c-code" maxlength="4" spellcheck="false" data-t-placeholder="coop.codeHint" /></div>
      </div>
      <div id="coop-status" class="status"></div>
      <button id="btn-coop-create" data-t="coop.create"></button>
      <button id="btn-coop-join" class="secondary" data-t="coop.join"></button>
      <button id="btn-coop-back" class="secondary" data-t="btn.back"></button>
    </div>
  </div>

  <div id="lobby" class="screen hidden">
    <div class="panel">
      <h2><span data-t="lobby.title"></span> <span id="lobby-code">····</span></h2>
      <p class="lede" id="lobby-sub" data-t="lobby.giveCode"></p>
      <ul id="lobby-players"></ul>
      <div id="lobby-mode" class="seg-row">
        <button data-mode="waves" data-t="mode.waves"></button>
        <button data-mode="survival" data-t="mode.survival"></button>
        <button data-mode="arena" data-t="mode.arena"></button>
      </div>
      <div id="lobby-arena" class="hidden">
        <div id="lobby-score" class="seg-row">
          <button data-score="10">10</button>
          <button data-score="15">15</button>
          <button data-score="25">25</button>
        </div>
        <div id="lobby-time" class="seg-row">
          <button data-time="300">5 min</button>
          <button data-time="480">8 min</button>
          <button data-time="720">12 min</button>
        </div>
      </div>
      <p class="lede small" id="lobby-mode-help"></p>
      <div id="lobby-diff" class="seg-row">
        <button data-diff="easy" data-t="diff.easy"></button>
        <button data-diff="normal" data-t="diff.normal"></button>
        <button data-diff="hard" data-t="diff.hard"></button>
      </div>
      <div id="lobby-status" class="status"></div>
      <button id="btn-lobby-start" data-t="lobby.start"></button>
      <button id="btn-lobby-leave" class="secondary" data-t="lobby.leave"></button>
    </div>
  </div>

  <div id="board" class="screen hidden">
    <div class="panel">
      <h2 data-t="btn.board"></h2>
      <div class="seg-row" id="board-mode">
        <button data-mode="waves" data-t="mode.waves"></button>
        <button data-mode="survival" data-t="mode.survival"></button>
      </div>
      <div class="seg-row" id="board-diff">
        <button data-diff="easy" data-t="diff.easy"></button>
        <button data-diff="normal" data-t="diff.normal"></button>
        <button data-diff="hard" data-t="diff.hard"></button>
      </div>
      <div id="board-table"></div>
      <button id="btn-board-back" data-t="btn.back"></button>
    </div>
  </div>

  <template id="help-tpl">
    <div class="keys">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <span data-t="help.arrows"></span></div><div data-t="help.move"></div>
      <div><kbd>Shift</kbd></div><div data-t="help.sprint"></div>
      <div><kbd data-t="help.space"></kbd></div><div data-t="help.jump"></div>
      <div><kbd data-t="help.leftClick"></kbd></div><div data-t="help.fire"></div>
      <div><kbd data-t="help.rightClick"></kbd></div><div data-t-html="help.aim"></div>
      <div><kbd>R</kbd></div><div data-t="help.reload"></div>
      <div><kbd>G</kbd></div><div class="t-grenade"></div>
      <div class="torch-only"><kbd>F</kbd></div><div class="torch-only" data-t="help.torch"></div>
      <div class="torch-only"><kbd>E</kbd></div><div class="torch-only" data-t="help.lever"></div>
      <div class="mp-only"><kbd>E</kbd> <span data-t="help.hold"></span></div><div class="mp-only" data-t="help.revive"></div>
      <div class="mp-only"><kbd>Tab</kbd> <span data-t="help.hold"></span></div><div class="mp-only" data-t="help.scores"></div>
      <div><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd><kbd>5</kbd> / <span data-t="help.wheel"></span></div><div data-t="help.switch"></div>
      <div><kbd data-t="help.esc"></kbd></div><div data-t="help.pause"></div>
    </div>
    <p class="tips t-tips"></p>
  </template>

  <template id="help-touch-tpl">
    <div class="keys touch-keys">
      <div><svg class="ti"><use href="#i-stick"/></svg></div><div data-t="help.touchMove"></div>
      <div><svg class="ti"><use href="#i-drag"/></svg></div><div data-t="help.touchLook"></div>
      <div><svg class="ti"><use href="#i-fire"/></svg></div><div data-t="help.touchFire"></div>
      <div><svg class="ti"><use href="#i-aim"/></svg></div><div data-t-html="help.touchAim"></div>
      <div><svg class="ti"><use href="#i-jump"/></svg></div><div data-t="help.jump"></div>
      <div><svg class="ti"><use href="#i-reload"/></svg></div><div data-t="help.reload"></div>
      <div><i class="gren"></i></div><div class="t-grenade"></div>
      <div class="torch-only"><svg class="ti"><use href="#i-torch"/></svg></div><div class="torch-only" data-t="help.torch"></div>
      <div><svg class="ti"><use href="#i-action"/></svg></div><div data-t="help.touchAction"></div>
      <div><svg class="ti"><use href="#i-slots"/></svg></div><div data-t="help.touchSwitch"></div>
      <div><svg class="ti"><use href="#i-pause"/></svg></div><div data-t="help.pause"></div>
    </div>
    <p class="tips t-tips"></p>
  </template>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
